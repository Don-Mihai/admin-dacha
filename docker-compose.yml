services:
  postgres:
    image: postgres:16-alpine
    container_name: utkina-cms-db
    environment:
      POSTGRES_USER: utkina
      POSTGRES_PASSWORD: utkina
      POSTGRES_DB: utkina_cms
    ports:
      - '5432:5432'
    volumes:
      - utkina_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U utkina -d utkina_cms']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  utkina_pg_data:
